# GitLab Pages for Node.js Web App
# Supports parallel deployments for all branches and merge requests
image: registry.redhat.io/ubi8/nodejs-18:latest

stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  NODE_OPTIONS: "--max-old-space-size=6144"

default:
  tags:
    - itup-alm-arm

# Build for default branch (root deployment)
build:default:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build for non-default branches (branch subdirectory deployment)
build:branch:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/${CI_COMMIT_BRANCH}/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Build for merge request previews
build:mr:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/mr-${CI_MERGE_REQUEST_IID}/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  variables:
    PAGES_PREFIX: ""
  script:
    - echo "Deploying to GitLab Pages at ${CI_PAGES_URL}"
  pages:
    path_prefix: "$PAGES_PREFIX"
    expire_in: 2 weeks
  environment:
    name: "Pages ${PAGES_PREFIX}"
    url: $CI_PAGES_URL
  artifacts:
    paths:
      - public
  rules:
    # Default branch gets root URL (no prefix = main deployment, won't expire)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Other branches get /<branch> URL
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      variables:
        PAGES_PREFIX: "$CI_COMMIT_BRANCH"
    # MR previews get /mr-<IID> URL
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      variables:
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID"
