# GitLab Pages for Node.js Web App
# Supports parallel deployments for all branches and merge requests
image: registry.redhat.io/ubi8/nodejs-18:latest

stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  NODE_OPTIONS: "--max-old-space-size=6144"

default:
  tags:
    - itup-alm-arm

# Build for default branch (root deployment)
build:default:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build for non-default branches (branch subdirectory deployment)
build:branch:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/${CI_COMMIT_BRANCH}/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Build for merge request previews
build:mr:
  stage: build
  variables:
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    ASSET_PATH: "/mr-${CI_MERGE_REQUEST_IID}/"
  script:
    - npm ci --include=dev
    - export PATH="$PWD/node_modules/.bin:$PATH"
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Pages deployment for default branch (root URL)
pages:default:
  stage: deploy
  needs:
    - job: build:default
      artifacts: true
  script:
    - echo "Deploying to GitLab Pages at ${CI_PAGES_URL}"
  pages:
    path_prefix: ""
  environment:
    name: "Pages - main"
    url: $CI_PAGES_URL
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Pages deployment for non-default branches (/<branch> URL)
pages:branch:
  stage: deploy
  needs:
    - job: build:branch
      artifacts: true
  script:
    - echo "Deploying to GitLab Pages at ${CI_PAGES_URL}/${CI_COMMIT_BRANCH}"
  pages:
    path_prefix: "$CI_COMMIT_BRANCH"
    expire_in: 2 weeks
  environment:
    name: "Pages - $CI_COMMIT_BRANCH"
    url: "${CI_PAGES_URL}/${CI_COMMIT_BRANCH}"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Pages deployment for merge request previews (/mr-<IID> URL)
pages:mr:
  stage: deploy
  needs:
    - job: build:mr
      artifacts: true
  script:
    - echo "Deploying MR preview to ${CI_PAGES_URL}/mr-${CI_MERGE_REQUEST_IID}"
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    expire_in: 2 weeks
  environment:
    name: "Pages - MR-$CI_MERGE_REQUEST_IID"
    url: "${CI_PAGES_URL}/mr-${CI_MERGE_REQUEST_IID}"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
